name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: 单元测试（离线，不访问校园网）
        run: python -m unittest discover -s tests -v

      - name: CLI 冒烟
        run: |
          python -m nbwdigest --help
          python nbw_digest.py --help

      - name: 服务端冒烟（仅检查启动参数）
        run: python -m nbwdigest serve --help

      - name: 确认前端资源随包分发
        run: |
          python -c "from nbwdigest import webapp; p = webapp.WEB_DIR / 'index.html'; assert p.is_file(), p; print('web assets ok:', p)"

      # 中文帮助在 GBK/cp1252 控制台下曾经会 UnicodeEncodeError，这里守住
      - name: 非 UTF-8 控制台兼容性
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: cp936
        run: |
          python -m nbwdigest --help
          python -m nbwdigest serve --help
          python nbw_digest.py --help
