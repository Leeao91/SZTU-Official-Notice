<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>公文通 · 每日汇总</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top">
  <div class="bar">
    <div class="brand">
      <span class="logo">公文</span>
      <div>
        <h1>公文通 · 每日汇总</h1>
        <div class="sub" id="sub">深圳技术大学</div>
      </div>
    </div>
    <button id="refresh" class="icon-btn" title="刷新" aria-label="刷新">↻</button>
  </div>
  <nav class="days" id="days" aria-label="选择日期"></nav>
</header>

<div class="filters">
  <div class="search-wrap">
    <input id="search" type="search" placeholder="搜索标题 / 单位 / 要点" autocomplete="off">
    <button id="clear-search" class="clear" aria-label="清空">×</button>
  </div>
  <div class="chips" id="cats"></div>
  <label class="toggle"><input type="checkbox" id="only-due"> 只看近期截止</label>
</div>

<main id="list" class="list"></main>
<div id="empty" class="empty" hidden></div>

<footer class="foot">
  <span id="foot-info">加载中…</span>
  <a href="https://nbw.sztu.edu.cn/list.jsp?urltype=tree.TreeTempUrl&wbtreeid=1029"
     target="_blank" rel="noreferrer">原站</a>
</footer>

<script src="/app.js"></script>
</body>
</html>
