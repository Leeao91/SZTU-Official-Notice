[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nbwdigest"
version = "1.0.0"
description = "深圳技术大学「公文通」每日更新汇总：抓取、增量比对、要点归纳，导出 Markdown / HTML / JSON，附手机版网页"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nbwdigest contributors" }]
keywords = ["sztu", "gongwentong", "crawler", "digest", "vsb", "cms", "rss-like"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nbwdigest = "nbwdigest.cli:main"
nbwdigest-serve = "nbwdigest.webapp:main"

[tool.setuptools]
packages = ["nbwdigest"]

[tool.setuptools.package-data]
nbwdigest = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
